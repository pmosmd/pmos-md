name: checks

# Cheap, offline checks on every pull request and push to main: the pipeline's own tests, and the page
# gate (structure, parity, UTM tags, counts, headings, and that no published issue was edited).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pipeline tests
        run: python3 -m unittest discover -s tests -q

      - name: Page gate (offline)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="origin/${{ github.base_ref }}"; else base="HEAD~1"; fi
          python3 scripts/selfcheck.py --offline --base "$base"
